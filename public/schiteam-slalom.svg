<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 760" fill="none">
  <style>
    .contour{stroke:rgba(255,255,255,.22);stroke-width:1.4}
    .track{stroke:#ffd400;stroke-width:5;stroke-linecap:round;stroke-dasharray:1300;stroke-dashoffset:1300;animation:draw 1.8s 1.05s cubic-bezier(.2,.75,.25,1) forwards}
    .point{fill:#ffd400;stroke:#c91424;stroke-width:7;opacity:0;animation:point .35s 1.95s ease forwards}
    .gate{opacity:0;animation:gate .38s ease forwards}
    .gate line{stroke:#fff;stroke-width:5;stroke-linecap:round}.gate rect{stroke:#fff;stroke-width:3}
    .gate.red rect{fill:#9d0b21}.gate.blue rect{fill:#0878ff}
    .g1{animation-delay:1.85s}.g2{animation-delay:2s}.g3{animation-delay:2.15s}.g4{animation-delay:2.3s}.g5{animation-delay:2.45s}
    .p2{animation-delay:2.1s}.p3{animation-delay:2.25s}.p4{animation-delay:2.4s}.p5{animation-delay:2.55s}
    @keyframes draw{to{stroke-dashoffset:0}}@keyframes point{to{opacity:1}}@keyframes gate{to{opacity:1}}
    @media(prefers-reduced-motion:reduce){.track{animation:none;stroke-dashoffset:0}.point,.gate{animation:none;opacity:1}}
  </style>
